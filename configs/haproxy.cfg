# =============================================================================
# HAProxy Configuration Template
# =============================================================================
# SSL/TLS termination for persona-bot services
# Copy to: /etc/haproxy/haproxy.cfg
# =============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    user haproxy
    group haproxy
    daemon
    
    # SSL configuration
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tlsv12
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    retries 3
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# =============================================================================
# Frontend HTTP to HTTPS Redirect (optional)
# =============================================================================
frontend http-redirect
    bind :80
    http-request redirect scheme https unless { ssl_fc }

# =============================================================================
# Main HTTPS Frontend
# =============================================================================
frontend https-in
    bind :443 ssl crt /etc/ssl/certs/persona-bot.pem crt /etc/ssl/certs/persona-bot.key
    
    # Security headers
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"
    http-response set-header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';"
    
    # SPA routing - redirect 404s to index.html
    acl is_api path_beg /api
    acl is_static path_beg /_next/static /static /images
    
    use_backend api-backend if is_api
    use_backend frontend-backend if is_static
    use_backend frontend-backend

# =============================================================================
# Backend: API Server
# =============================================================================
backend api-backend
    option httpchk GET /health
    http-check expect status 200
    server api-1 ${BACKEND_HOST:-backend}:${BACKEND_PORT:-3001} check inter 2000 rise 2 fall 3

# =============================================================================
# Backend: Frontend (Next.js)
# =============================================================================
backend frontend-backend
    option httpchk GET /
    http-check expect status 200
    server frontend-1 ${FRONTEND_HOST:-frontend}:${FRONTEND_PORT:-3000} check inter 2000 rise 2 fall 3

# =============================================================================
# WebSocket Support (for real-time chat)
# =============================================================================
frontend websocket-in
    bind :443 ssl crt /etc/ssl/certs/persona-bot.pem
    option tcplog
    mode tcp
    
    # Match WebSocket upgrade requests
    acl is_websocket hdr(Upgrade) -i websocket
    acl is_websocket hdr_beg(Host) -i ws
    
    use_backend websocket-backend if is_websocket

backend websocket-backend
    mode tcp
    option tcplog
    option httpchk GET /health
    server ws-1 ${BACKEND_HOST:-backend}:${BACKEND_PORT:-3001} check inter 2000 rise 2 fall 3

# =============================================================================
# Docker Compose Integration
# =============================================================================
# For local development with docker-compose:
# - Remove ssl crt lines or use self-signed certs
# - Point to container names (backend, frontend)
# - Use ports defined in docker-compose.yml
#
# Example local config:
#   frontend https-in
#       bind :443
#       server backend backend:3001
#   frontend websocket-in
#       bind :9443
#       server ws-backend backend:3001

# =============================================================================
# SSL Certificate Generation (for testing)
# =============================================================================
# Generate self-signed certificate:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout persona-bot.key -out persona-bot.pem \
#     -subj "/C=US/ST=State/L=City/O=PersonaBot/CN=persona-bot.com"
#
# For production, use Let's Encrypt or purchased certificate.
